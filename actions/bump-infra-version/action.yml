name: Підняти версію в kite-infra
description: >-
  Після публікації образу відкриває в репозиторії kite-infra pull request, який
  піднімає рядок сервіса у versions.env. Мердж цього PR і є «деплоєм» на стенд
  (12.6). Рядок міняє scripts/bump.sh самого kite-infra — той самий, що й
  `make bump`. На сервіс один відкритий PR (гілка bump/<сервіс>): новий тег
  оновлює його, а не відкриває ще один. Без токена з правом на запис у
  kite-infra крок тихо пропускається.

inputs:
  service:
    description: Ім'я сервіса — ключ у versions.env
    required: true
  tag:
    description: Новий тег образу (sha-… або v…)
    required: true
  infra-repo:
    description: Репозиторій-оркестратор
    required: false
    default: ${{ github.repository_owner }}/kite-infra
  versions-file:
    description: Файл з версіями образів
    required: false
    default: versions.env
  token:
    description: Токен з правом contents:write і pull-requests:write у kite-infra
    required: false
    default: ''

outputs:
  pull-request:
    description: Посилання на відкритий або оновлений PR
    value: ${{ steps.bump.outputs.pull-request }}

runs:
  using: composite
  steps:
    - name: Відкрити або оновити PR з новою версією
      id: bump
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INFRA_REPO: ${{ inputs.infra-repo }}
        VERSIONS_FILE: ${{ inputs.versions-file }}
        SERVICE: ${{ inputs.service }}
        TAG: ${{ inputs.tag }}
        SOURCE_REPO: ${{ github.repository }}
        SOURCE_SHA: ${{ github.sha }}
        SERVER_URL: ${{ github.server_url }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail

        if [ -z "${GH_TOKEN:-}" ]; then
          echo "::notice::Токен для kite-infra не заданий — версію не піднімаю."
          echo "Додай секрет INFRA_BUMP_TOKEN в організації, щоб увімкнути автоматичний bump." >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        branch="bump/${SERVICE}"
        work="$(mktemp -d)"

        git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${INFRA_REPO}.git" "$work"
        cd "$work"
        git config user.name "kite-ci"
        git config user.email "kite-ci@users.noreply.github.com"

        if [ ! -x scripts/bump.sh ]; then
          echo "::error::У ${INFRA_REPO} немає scripts/bump.sh — нема чим піднімати версію."
          exit 1
        fi

        # Ключ лише для тексту PR; сам рядок міняє bump.sh (тег, ключ, відмови — там).
        key="$(printf '%s' "$SERVICE" | tr '[:lower:]-' '[:upper:]_')_TAG"
        current="$(grep -E "^${key}=" "$VERSIONS_FILE" | head -1 | cut -d= -f2- || true)"

        if ! out="$(CI=true VERSIONS_FILE="$VERSIONS_FILE" scripts/bump.sh "$SERVICE" "$TAG" 2>&1)"; then
          echo "::error::scripts/bump.sh відмовив: $out"
          exit 1
        fi
        echo "$out"

        existing="$(gh pr list --repo "$INFRA_REPO" --head "$branch" \
          --state open --json url --jq '.[0].url // empty')"

        if git diff --quiet -- "$VERSIONS_FILE"; then
          echo "::notice::${key} у main вже дорівнює ${TAG} — PR не потрібен."
          # Відкритий PR зі старішим тегом після цього лише відкотив би версію.
          if [ -n "$existing" ]; then
            gh pr close "$existing" --delete-branch \
              --comment "У main уже \`${TAG}\` — цей PR застарів."
            echo "Закрито застарілий PR: $existing" >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
        fi

        git checkout -B "$branch"
        git add "$VERSIONS_FILE"
        git commit -m "Підняти ${SERVICE} до ${TAG}" \
          -m "Джерело: ${SOURCE_REPO}@${SOURCE_SHA}"
        # Гілка одна на сервіс: кожен новий тег переписує її поверх свіжого main.
        git push --force origin "$branch"

        owner="${INFRA_REPO%%/*}"
        title="Підняти ${SERVICE} до ${TAG}"
        image_url="${SERVER_URL}/orgs/${owner}/packages/container/package/${SERVICE}"
        commit_url="${SERVER_URL}/${SOURCE_REPO}/commit/${SOURCE_SHA}"
        body="$(printf '%s\n\n%s\n\n%s\n' \
          "Образ [\`ghcr.io/${owner}/${SERVICE}:${TAG}\`](${image_url}) опубліковано з [${SOURCE_REPO}@${SOURCE_SHA:0:7}](${commit_url}) ([прогін](${RUN_URL}))." \
          "\`${key}\`: \`${current:-—}\` → \`${TAG}\`" \
          "Мердж цього PR = деплой сервіса на стенд. Наступна публікація ${SERVICE} оновить цей PR, а не відкриє новий. Руками те саме: \`make bump SERVICE=${SERVICE} TAG=${TAG}\`.")"

        if [ -n "$existing" ]; then
          gh pr edit "$existing" --repo "$INFRA_REPO" --title "$title" --body "$body"
          url="$existing"
          echo "PR оновлено: $url"
        else
          url="$(gh pr create --repo "$INFRA_REPO" \
            --head "$branch" --title "$title" --body "$body")"
          echo "PR створено: $url"
        fi

        echo "pull-request=$url" >> "$GITHUB_OUTPUT"
        echo "Версія ${SERVICE} → \`${TAG}\`: $url" >> "$GITHUB_STEP_SUMMARY"
